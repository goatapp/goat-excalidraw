services:
  postgres:
    image: postgres:16-alpine
    container_name: excalidash-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=excalidash
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio:latest
    container_name: excalidraw-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/excalidraw &&
      mc anonymous set download local/excalidraw &&
      exit 0
      "

  excalidraw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: excalidraw-combined
    ports:
      - "8000:8000"
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/excalidash
      - PORT=8000
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:8000
      - AUTH_MODE=${AUTH_MODE:-local}
      - TRUST_PROXY=false
      - JWT_SECRET=${JWT_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - S3_BUCKET_NAME=excalidraw
      - S3_PREFIX=excalidraw/
      - S3_SYNC_INTERVAL_MS=30000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_REGION=us-east-1
    #  - S3_PUBLIC_URL=http://localhost:9000/excalidraw
      - S3_FORCE_PATH_STYLE=true
    volumes:
      - app-data:/app/prisma
      - app-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app-data:
  app-uploads:
  minio-data:
  postgres-data:
